version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: aiskillsense-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: ai_skill_sense
    ports:
      - "5432:5432"
    volumes:
      - ai-skill-senseenhanced_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_skill_sense"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: aiskillsense-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://postgres:mysecretpassword@db:5432/ai_skill_sense?schema=public
      - HF_ACCESS_TOKEN=${HF_ACCESS_TOKEN}
    depends_on:
      db:
        condition: service_healthy

volumes:
  ai-skill-senseenhanced_pgdata:
    external: true