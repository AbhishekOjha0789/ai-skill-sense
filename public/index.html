<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Skill Sense | Autonomous Command Center</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="css/main.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .glow-card { background: linear-gradient(180deg, rgba(30, 41, 59, 0.4) 0%, rgba(15, 23, 42, 0.7) 100%); }
        .modal-backdrop { background: rgba(2, 6, 23, 0.85); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen selection:bg-emerald-500 selection:text-slate-950">

    <!-- AUTHENTICATION SCREEN -->
    <div id="screen-auth" class="min-h-screen flex items-center justify-center p-6">
        <div class="max-w-md w-full glow-card border border-slate-800 rounded-3xl p-8 shadow-2xl">
            <div class="text-center mb-8">
                <div class="inline-flex p-3 rounded-2xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 mb-4">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                </div>
                <h2 class="text-2xl font-bold text-white tracking-tight">Autonomous Core Access</h2>
                <p class="text-xs text-slate-400 mt-1">Authenticate to link telemetry & daemon feedback loops.</p>
            </div>
            
            <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-4">
                <div id="name-field" class="hidden">
                    <label class="block text-xs font-mono uppercase tracking-wider text-slate-400 mb-1">Agent Handle</label>
                    <input type="text" id="auth-name" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-emerald-500 text-white">
                </div>
                <div>
                    <label class="block text-xs font-mono uppercase tracking-wider text-slate-400 mb-1">Secure Identifier (Email)</label>
                    <input type="email" id="auth-email" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-emerald-500 text-white" value="abhishek@test.com">
                </div>
                <div>
                    <label class="block text-xs font-mono uppercase tracking-wider text-slate-400 mb-1">Access Key</label>
                    <input type="password" id="auth-password" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-emerald-500 text-white" value="password123">
                </div>
                <button type="submit" id="auth-submit-btn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 rounded-xl transition text-sm shadow-lg shadow-emerald-950/50">Establish Uplink</button>
            </form>
            
            <div class="mt-6 text-center text-xs text-slate-400">
                <span id="auth-toggle-text">New agent?</span>
                <button onclick="toggleAuthMode()" id="auth-toggle-btn" class="text-emerald-400 font-semibold ml-1 hover:underline">Register clearance</button>
            </div>
        </div>
    </div>

    <!-- COMMAND CENTER APP SHELL -->
    <div id="screen-app" class="hidden min-h-screen flex flex-col">
        <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur sticky top-0 z-50 px-8 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-6">
                <div class="flex items-center space-x-3">
                    <div class="h-3 w-3 rounded-full bg-emerald-500 animate-pulse"></div>
                    <span class="font-bold text-sm tracking-wider text-white">AI SKILL SENSE <span class="text-xs text-emerald-400 font-mono ml-2">COMMAND CENTER</span></span>
                </div>
                <nav class="hidden md:flex space-x-2">
                    <button onclick="switchView('dashboard')" id="nav-dashboard" class="px-3.5 py-1.5 rounded-lg text-xs font-medium transition bg-slate-800 text-white">Overview</button>
                    <button onclick="switchView('matrix')" id="nav-matrix" class="px-3.5 py-1.5 rounded-lg text-xs font-medium transition text-slate-400 hover:text-white">Life Matrix</button>
                    <button onclick="switchView('quests')" id="nav-quests" class="px-3.5 py-1.5 rounded-lg text-xs font-medium transition text-slate-400 hover:text-white">Quests Hub</button>
                    <button onclick="switchView('telemetry')" id="nav-telemetry" class="px-3.5 py-1.5 rounded-lg text-xs font-medium transition text-slate-400 hover:text-white">Telemetry & Bridge</button>
                </nav>
            </div>
            <div class="flex items-center space-x-4">
                <span id="user-display" class="text-xs font-mono text-slate-400"></span>
                <button onclick="logout()" class="text-xs bg-red-500/10 text-red-400 border border-red-500/20 px-3 py-1.5 rounded-lg hover:bg-red-500/20 transition font-medium">Disconnect</button>
            </div>
        </header>

        <main class="flex-1 max-w-7xl w-full mx-auto px-6 py-8">
            <!-- DYNAMIC VIEW CONTAINER -->
            <div id="view-container"></div>
        </main>
    </div>

    <!-- UNIVERSAL DEEP-DIVE INSPECTION MODAL -->
    <div id="inspector-modal" class="fixed inset-0 modal-backdrop hidden z-50 flex items-center justify-center p-4">
        <div class="glow-card border border-slate-800 rounded-3xl max-w-xl w-full p-8 shadow-2xl relative">
            <div class="flex justify-between items-start mb-6">
                <div>
                    <span id="modal-tag" class="text-[10px] font-mono uppercase tracking-widest px-2.5 py-1 rounded-md bg-slate-800 text-emerald-400"></span>
                    <h3 id="modal-title" class="text-xl font-bold text-white mt-2"></h3>
                </div>
                <button onclick="closeInspector()" class="text-slate-400 hover:text-white text-sm font-mono bg-slate-900 border border-slate-800 px-3 py-1 rounded-xl">✕</button>
            </div>
            <div id="modal-body" class="space-y-4 text-xs text-slate-300"></div>
            <div id="modal-actions" class="mt-6 pt-4 border-t border-slate-800/80 flex gap-3 justify-end"></div>
        </div>
    </div>

    <!-- SCRIPT LOADER -->
    <script src="js/api.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/matrix.js"></script>
    <script src="js/quests.js"></script>
    <script src="js/integrations.js"></script>
    <script>
        let isSignup = false;

        function toggleAuthMode() {
            isSignup = !isSignup;
            document.getElementById('name-field').classList.toggle('hidden', !isSignup);
            document.getElementById('auth-submit-btn').innerText = isSignup ? 'Initialize Registration' : 'Establish Uplink';
            document.getElementById('auth-toggle-text').innerText = isSignup ? 'Already cleared?' : 'New agent?';
            document.getElementById('auth-toggle-btn').innerText = isSignup ? 'Access login' : 'Register clearance';
        }

        async function handleAuth(event) {
            event.preventDefault();
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const name = document.getElementById('auth-name').value;

            const endpoint = isSignup ? '/auth/register' : '/auth/login';
            const payload = isSignup ? { name, email, password } : { email, password };

            try {
                const data = await apiRequest(endpoint, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                localStorage.setItem('token', data.token);
                checkAuthState();
            } catch (err) {
                alert(err.message);
            }
        }

        function logout() {
            localStorage.removeItem('token');
            checkAuthState();
        }

        function checkAuthState() {
            const token = localStorage.getItem('token');
            if (token) {
                document.getElementById('screen-auth').classList.add('hidden');
                document.getElementById('screen-app').classList.remove('hidden');
                switchView('dashboard');
            } else {
                document.getElementById('screen-auth').classList.remove('hidden');
                document.getElementById('screen-app').classList.add('hidden');
            }
        }

        function switchView(viewName) {
            ['dashboard', 'matrix', 'quests', 'telemetry'].forEach(v => {
                document.getElementById(`nav-${v}`)?.classList.replace('bg-slate-800', 'text-slate-400');
                document.getElementById(`nav-${v}`)?.classList.replace('text-white', 'text-slate-400');
            });
            document.getElementById(`nav-${viewName}`)?.classList.replace('text-slate-400', 'bg-slate-800');
            document.getElementById(`nav-${viewName}`)?.classList.replace('text-slate-400', 'text-white');

            const container = document.getElementById('view-container');
            container.innerHTML = '';

            if (viewName === 'dashboard') renderDashboardView(container);
            else if (viewName === 'matrix') renderMatrixView(container);
            else if (viewName === 'quests') renderQuestsView(container);
            else if (viewName === 'telemetry') renderTelemetryView(container);
        }

        function openInspector(tag, title, bodyHtml, actionsHtml = '') {
            document.getElementById('modal-tag').innerText = tag;
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-body').innerHTML = bodyHtml;
            document.getElementById('modal-actions').innerHTML = actionsHtml;
            document.getElementById('inspector-modal').classList.remove('hidden');
        }

        function closeInspector() {
            document.getElementById('inspector-modal').classList.add('hidden');
        }

        checkAuthState();
    </script>
</body>
</html>
